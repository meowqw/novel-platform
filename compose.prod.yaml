services:
  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build:
      context: .
      target: production
    image: novel-platform-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false

  worker:
    build:
      context: .
      target: production
    image: novel-platform-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
    stop_grace_period: 100s

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
