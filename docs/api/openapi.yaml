        created_at:
          type: ['string', 'null']
          format: date-time
        updated_at:
          type: ['string', 'null']
          format: date-time

    StoreWorkRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ['string', 'null']
          maxLength: 10000
        slug:
          type: ['string', 'null']
          minLength: 1
          maxLength: 220
        status:
          $ref: '#/components/schemas/WorkStatus'

    UpdateWorkRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ['string', 'null']
          maxLength: 10000
        slug:
          type: string
          minLength: 1
          maxLength: 220
        status:
          $ref: '#/components/schemas/WorkStatus'

    StoreChapterRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
