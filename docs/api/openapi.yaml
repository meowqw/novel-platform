          type: ['string', 'null']
          format: uuid

    PaginatedWorks:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    PublicCatalogWork:
      type: object
      required:
        - id
        - title
        - description
        - slug
        - status
        - author
        - cover_url
        - published_at
        - last_activity_at
        - published_chapters_count
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: ['string', 'null']
        slug:
          type: string
        status:
          $ref: '#/components/schemas/WorkStatus'
        author:
          $ref: '#/components/schemas/PublicUser'
        cover_url:
          type: ['string', 'null']
          description: Public thumb URL (`/public/media/{id}?variant=thumb`) when cover set
        published_at:
          type: ['string', 'null']
          format: date-time
          description: work_publications.published_at (overwritten on republish)
        last_activity_at:
          type: ['string', 'null']
          format: date-time
          description: |
            GREATEST(work published_at, max published chapter published_at).
            Null when both sides are null.
        published_chapters_count:
          type: integer
          minimum: 0

    PaginatedPublicCatalogWorks:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogWork'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    ProseMirrorMark:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [bold, italic, strike, code, link]
        attrs:
          type: object
          description: Required for link — href must be http/https; optional target, rel
          properties:
            href:
              type: string
              format: uri
            target:
              type: string
            rel:
              type: string
          additionalProperties: false

    ProseMirrorNode:
      type: object
      required: [type]
      description: |
        Allow-list from config/editor.php. Root must be type=doc.
        Limits (defaults): max_json_bytes=1048576, max_nodes=20000, max_depth=32,
        max_plain_text_chars=200000, max_images=100. Heading attrs.level ∈ {1,2,3}.
        Image attrs: mediaId (uuid), optional alt (≤300), width normal|wide|full. No src.
      properties:
        type:
          type: string
          enum:
            - doc
            - paragraph
            - text
            - heading
            - bulletList
            - orderedList
            - listItem
            - blockquote
            - hardBreak
            - horizontalRule
            - image
        text:
          type: string
          description: Required for type=text; whitespace preserved
        marks:
          type: array
          items:
            $ref: '#/components/schemas/ProseMirrorMark'
        attrs:
          type: object
          properties:
            level:
              type: integer
              enum: [1, 2, 3]
            mediaId:
              type: string
              format: uuid
            alt:
              type: string
              maxLength: 300
            width:
              type: string
              enum: [normal, wide, full]
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProseMirrorNode'
      additionalProperties: false

    ProseMirrorDoc:
      allOf:
        - $ref: '#/components/schemas/ProseMirrorNode'
      properties:
        type:
          const: doc

    DraftStats:
      type: object
      required: [characters, words]
      properties:
        characters:
          type: integer
        words:
          type: integer
          description: Whitespace-split Unicode tokens

    Draft:
      type: object
      required: [chapter_id, content, version, updated_at, stats]
      properties:
        chapter_id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/ProseMirrorDoc'
        version:
          type: integer
          minimum: 1
        updated_at:
          type: ['string', 'null']
          format: date-time
        stats:
          $ref: '#/components/schemas/DraftStats'

    SaveDraftRequest:
      type: object
      required: [content, version]
      properties:
        content:
          $ref: '#/components/schemas/ProseMirrorDoc'
        version:
          type: integer
          minimum: 1
          description: Expected current draft version (CAS)

    RevisionSummary:
      type: object
      required: [id, chapter_id, source_version, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        source_version:
          type: integer
        label:
          type: ['string', 'null']
        created_at:
          type: ['string', 'null']
          format: date-time

    RevisionDetail:
      allOf:
        - $ref: '#/components/schemas/RevisionSummary'
        - type: object
          required: [content, plain_text]
          properties:
            content:
              $ref: '#/components/schemas/ProseMirrorDoc'
            plain_text:
              type: string

    PaginatedRevisionSummaries:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSummary'
        links:
          type: object
          additionalProperties: true
        meta:
